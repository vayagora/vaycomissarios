<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--surface-sunken); font-family: var(--font-sans); color: var(--text-body);">

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px;">
      <img src="ds/vayagorav1_0fc08b/assets/logos/logo-tipografico-roxo.png" alt="Vay Agora" style="width: 148px; height: auto;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);">Portal do comissário</span>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 12px; color: var(--text-body); font-weight: 500; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>

      <a href="Creditos.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 12px; color: var(--text-body); font-weight: 500; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 0 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"></path><path d="M13 5v2M13 17v2M13 11v2"></path></svg>Extrato</a>
      <a href="Termo.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; border-radius: 12px; color: var(--text-body); font-weight: 500; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M16 13H8M16 17H8"></path></svg>Meu termo de parceria</a>
    </div>
    <div style="margin-top: auto; background: var(--surface-muted); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px;">
      <strong style="color: var(--text-strong); font-size: 15px;">Fale com a gente</strong>

      <a href="https://wa.me/553184698918" style="font-size: 14px; font-weight: 600;">Abrir WhatsApp →</a>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(20px, 4vw, 56px) 64px;">
    <div style="max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">

      <header>
        <h1 style="font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; font-size: 40px; line-height: 1.1; color: var(--text-strong);">Meus programas</h1>
      </header>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px;">
        <sc-for list="{{programs}}" as="p" hint-placeholder-count="4">
          <article style="background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 22px; box-shadow: var(--shadow-sm); padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: var(--surface-muted); color: var(--text-strong); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{p.initials}}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <h2 style="font-size: 18px; color: var(--text-strong);">{{p.name}}</h2>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 13px; color: var(--text-muted);">{{p.tierLabel}}</span>
              <span style="font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: -0.02em; line-height: 1.1; color: var(--text-strong);">{{p.tier}}</span>

            </div>
            <a href="ProgramaDetalhe.dc.html" style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--border-brand); font-weight: 600; font-size: 14px;">Ver detalhes</a>
          </article>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    const ok = { validColor: '#5C5E6B', validWeight: 400 };
    return {
      programs: [
        { name: 'LATAM Pass', initials: 'LA', tierLabel: 'Categoria', tier: 'Black', valid: 'Válida até 31/03/2027', ...ok },
        { name: 'Smiles', initials: 'SM', tierLabel: 'Categoria', tier: 'Diamante', valid: 'Válida até 20/12/2026', validColor: '#8A7826', validWeight: 600 }
      ]
    };
  }
}
</script>
